<div class="form-wrapper">

  <mat-card class="form-card">

    <mat-card-title>
      {{ isEditMode ? 'Edit Blog' : 'Create Blog' }}
    </mat-card-title>

    <mat-card-content>

      <form [formGroup]="blogForm" (ngSubmit)="onSubmit()">

        <div class="form-fields">

          <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name">
            <mat-error *ngIf="blogForm.get('name')?.hasError('required')">
              Name is required
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Description</mat-label>
            <textarea matInput rows="4" formControlName="description"></textarea>
            <mat-error *ngIf="blogForm.get('description')?.hasError('required')">
              Description is required
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
  <mat-label>Genre</mat-label>
  <mat-select formControlName="genre">
    <mat-option *ngFor="let g of genres" [value]="g">
      {{ g }}
    </mat-option>
  </mat-select>
  <mat-error *ngIf="blogForm.get('genre')?.hasError('required')">
    Genre is required
  </mat-error>
</mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Author</mat-label>
            <input matInput formControlName="author">
            <mat-error *ngIf="blogForm.get('author')?.hasError('required')">
              Author is required
            </mat-error>
          </mat-form-field>

        </div>

        <div class="button-group">
          <button mat-stroked-button color="accent" type="button" (click)="onCancel()">
            Cancel
          </button>

          <button mat-raised-button color="primary" type="submit" [disabled]="blogForm.invalid">
            {{ isEditMode ? 'Update' : 'Save' }}
          </button>
        </div>

      </form>

    </mat-card-content>

  </mat-card>

</div>
